# Self-hosting: `docker compose up` serves the app at http://localhost:8000.
# Optional overrides come from a `.env` file next to this file (see .env.example).

services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # Always talk to the bundled Postgres, whatever DATABASE_URL says in .env.
      DATABASE_URL: postgresql://${POSTGRES_USER:-jbi}:${POSTGRES_PASSWORD:-jbi}@postgres:5432/${POSTGRES_DB:-jbi}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jbi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jbi}
      POSTGRES_DB: ${POSTGRES_DB:-jbi}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jbi} -d ${POSTGRES_DB:-jbi}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

volumes:
  pgdata:
