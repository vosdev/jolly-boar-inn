name: CI

on:
  push:
    branches: [main]
  pull_request:
  # New vulnerabilities are published against code that has not changed.
  schedule:
    - cron: "17 6 * * 1"

# Actions are pinned to commit SHAs, since a tag can be moved to other code. Only the
# release job may write.
#
# Jobs run on the runner named by the RUNNER repository variable. Forks lack the variable,
# and pull requests from forks must never reach a self-hosted runner, so both fall back to
# GitHub-hosted runners.
permissions:
  contents: read

jobs:
  server:
    name: Server (ruff, pytest, packs, contrast)
    runs-on: ${{ (vars.RUNNER && !github.event.pull_request.head.repo.fork) && vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: jbi
          POSTGRES_PASSWORD: jbi
          POSTGRES_DB: jbi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jbi -d jbi"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL_TEST: postgresql://jbi:jbi@localhost:5432/jbi
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: uv run python scripts/validate_packs.py
      - run: uv run python scripts/check_contrast.py

  client:
    name: Client (lint, svelte-check, vitest, build)
    runs-on: ${{ (vars.RUNNER && !github.event.pull_request.head.repo.fork) && vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # pnpm's installer runs node, which a self-hosted runner does not have until
      # setup-node puts it on the PATH, so pnpm comes second and caches its own store.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          package_json_file: client/package.json
          cache: true
          cache_dependency_path: client/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  # Known vulnerabilities in what we import, high and critical only. Trivy skips those with
  # no fix to move to. It reads uv.lock, but only the first document of pnpm's lockfile,
  # which holds pnpm itself, so the client goes through pnpm audit, whose --ignore-unfixable
  # reports nothing at all.
  audit:
    name: Audit (lockfiles)
    runs-on: ${{ (vars.RUNNER && !github.event.pull_request.head.repo.fork) && vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Scan server/uv.lock
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: server/uv.lock
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          version: v0.75.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          package_json_file: client/package.json
      - run: pnpm audit --audit-level high
        working-directory: client

  containers:
    name: Containers (build, compose smoke test)
    runs-on: ${{ (vars.RUNNER && !github.event.pull_request.head.repo.fork) && vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    # docker-compose.yml requires this rather than defaulting to the dev password.
    env:
      POSTGRES_PASSWORD: jbi
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          # :latest is the name docker-compose.yml gives the app, so compose runs this
          # image rather than building its own.
          tags: |
            jolly-boar-inn:ci
            jolly-boar-inn:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The data stage reads the builder layers above but writes its own scope, since a second
      # export to the same one would replace the app's cache.
      - name: Build data image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: data
          load: true
          tags: jolly-boar-inn-data:latest
          cache-from: |
            type=gha
            type=gha,scope=data
          cache-to: type=gha,mode=max,scope=data
      # Proves the container has git, the venv and the mounted checkout; sends nothing.
      - name: Data scripts run in the data container
        run: |
          HOST_UID=$(id -u) HOST_GID=$(id -g) \
            docker compose -f docker-compose.data.yml run --rm data python scripts/fetch_assets.py --dry-run
      - name: Compose up and check health
        run: |
          docker compose up -d --wait --wait-timeout 120
          body=$(curl -fsS http://localhost:8000/api/health)
          echo "health: $body"
          test "$body" = '{"ok":true,"db":true}'
          curl -fsS http://localhost:8000/ | grep -q '<title>The Jolly Boar Inn</title>'

      # A player opening the host's link lands on /r/CODE, which exists only in the
      # client router: the server has to answer it with index.html or the link is dead
      # for everyone who did not arrive via the home page.
      - name: Check SPA deep link and API caching
        run: |
          curl -fsS http://localhost:8000/r/TEST | grep -q '<title>The Jolly Boar Inn</title>'
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:8000/api/rooms/TEST)" = 404
          curl -fsS -D - -o /dev/null http://localhost:8000/api/modes | grep -qi '^cache-control: no-store'

      # The one path curl cannot reach, and the one most likely to break in the image
      # rather than in the code: the websocket upgrade under uvicorn --proxy-headers.
      - name: Websocket smoke test
        run: docker compose exec -T app python scripts/smoke_ws.py
      # After the smoke tests, so a vulnerable base image does not hide a broken one.
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: jolly-boar-inn:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          version: v0.75.0
      - name: Compose logs
        if: always()
        run: docker compose logs
      - name: Compose down
        if: always()
        run: docker compose down -v

  # Every T or D task bumps VERSION (ideas/architecture.md, Versioning). A main commit that
  # passed everything above and carries a version with no tag yet becomes a release: tag
  # v<VERSION> and a GitHub Release, notes built from the merged PRs. A commit that did not
  # bump is a no-op; one that moved the version backwards fails.
  release:
    name: Release (tag when VERSION changes)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [server, client, audit, containers]
    runs-on: ${{ (vars.RUNNER && !github.event.pull_request.head.repo.fork) && vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Tag and release a new version
        run: |
          version=$(cat VERSION)
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists: nothing to release"
            exit 0
          fi
          latest=$(git tag --list 'v*' | sort -V | tail -n 1)
          if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$latest" "$tag" | sort -V | tail -n 1)" != "$tag" ]; then
            echo "::error::VERSION $version is below the latest release $latest"
            exit 1
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes
