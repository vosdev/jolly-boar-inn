name: Map

# The render takes minutes, so a pull request runs it only when something it reads changes.
# Pushes to main and the weekly run always do: the pinned cache and the base image drift too.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/map.yml
      - Dockerfile
      - data/map.json
      - server/pyproject.toml
      - server/uv.lock
      - server/scripts/gen_map.py
      - server/scripts/fetch_assets.py
      - server/scripts/map_render/**
      - server/app/map.py
  schedule:
    - cron: "17 6 * * 1"

# Same runner rule as ci.yml: pull requests from forks never reach a self-hosted runner.
permissions:
  contents: read

jobs:
  # The real renderer, which test_gen_map.py stubs, in a container no bigger than the smallest
  # host gen-map supports: Java sizes its default heap from the machine, so a big runner hides
  # a render that a small server cannot finish.
  map:
    name: Map (render under the memory floor)
    runs-on: ${{ (vars.RUNNER && !github.event.pull_request.head.repo.fork) && vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Read the pin
        run: |
          echo "CACHE_ID=$(sed -n 's/.*"cache_id": *\([0-9]*\).*/\1/p' data/map.json)" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build map image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: map
          load: true
          tags: jolly-boar-inn-map:latest
          cache-from: |
            type=gha,scope=data
            type=gha,scope=map
          cache-to: type=gha,mode=max,scope=map
      # Outside .map/, which a finished run deletes. OpenRS2 is asked once per pin.
      - name: Restore the pinned cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/map-cache
          key: map-${{ hashFiles('data/map.json') }}
      - name: Download the pinned cache
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/map-cache"
          curl -fsS -A "jolly-boar-inn CI (https://github.com/vosdev/jolly-boar-inn)" \
            -o "$RUNNER_TEMP/map-cache/disk.zip" "https://archive.openrs2.org/caches/runescape/$CACHE_ID/disk.zip"
      - name: Save the pinned cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/map-cache
          key: map-${{ hashFiles('data/map.json') }}
      # The Makefile's 1.5 GB of free memory, with no swap to lean on.
      - name: Render the map
        run: |
          mkdir -p .map
          cp "$RUNNER_TEMP/map-cache/disk.zip" ".map/disk-$CACHE_ID.zip"
          docker run --rm --memory 1536m --memory-swap 1536m -u "$(id -u):$(id -g)" \
            -v "$PWD:/repo" jolly-boar-inn-map:latest python scripts/gen_map.py
          test -f "client/public/map/$CACHE_ID/clean/manifest.json"
