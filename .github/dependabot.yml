version: 2

# Every ecosystem lands in one weekly PR, so a round of updates costs a single version bump.
# Security updates are not version updates: they come as their own PRs, ignoring the
# group, the cooldown and the ignores.
multi-ecosystem-groups:
  weekly:
    schedule:
      interval: weekly
      day: monday

# A compromised release is usually yanked within days; waiting a week keeps it off the
# self-hosted runners, which run whatever an update PR installs.
#
# A major version is a migration, and one failing package holds back the whole group: those
# are tasks of their own, not a weekly bump. So is a Python minor, a runtime change.
updates:
  - package-ecosystem: uv
    directory: /server
    multi-ecosystem-group: weekly
    patterns: ["*"]
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /client
    multi-ecosystem-group: weekly
    patterns: ["*"]
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    multi-ecosystem-group: weekly
    patterns: ["*"]
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /
    multi-ecosystem-group: weekly
    patterns: ["*"]
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: python
        update-types: ["version-update:semver-minor"]

  - package-ecosystem: docker-compose
    directory: /
    multi-ecosystem-group: weekly
    patterns: ["*"]
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
