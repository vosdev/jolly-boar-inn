[project]
name = "jolly-boar-inn"
version = "0.281.2"
description = "Jolly Boar Inn Quiz Night server"
requires-python = ">=3.14"
license = "AGPL-3.0-only"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2",
    "pydantic-settings>=2",
    "asyncpg>=0.30",
    "jsonschema>=4.23",
    "prometheus-client>=0.21",
    # Re-encodes suggested screenshots, and the data scripts draw with it.
    "pillow>=11",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.6",
    "pyyaml>=6",
    "mypy==2.4.1",
]
# `make logo`, the owner's tool: never in the runtime image.
logo = [
    "numpy>=2",
    "opencv-python-headless>=4.10",
    "resvg-py>=0.2",
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# A frame that never comes blocks ``receive_json`` forever; this turns that into a failure
# that names the test.
timeout = 60
# The tests wait on timers and Postgres more than they compute, so they run in parallel; at
# most 8 workers, as each app pool may hold 10 of Postgres's default 100 connections.
addopts = "-n auto --maxprocesses 8 --dist worksteal"
markers = [
    "empty_database: the test database starts with no migrations applied",
]

[tool.mypy]
python_version = "3.14"
files = ["app"]
# A name given a value of another type, a branch or a loop later, takes both types instead
# of failing: the code reuses names that way, and nothing about it is wrong.
allow_redefinition_new = true
local_partial_types = true

# asyncpg and jsonschema ship no types, and pyroscope is installed only where profiling is on.
[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*", "jsonschema", "jsonschema.*", "pyroscope"]
ignore_missing_imports = true
