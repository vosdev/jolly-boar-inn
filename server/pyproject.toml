[project]
name = "jolly-boar-inn"
version = "0.39.0"
description = "Jolly Boar Inn Quiz Night server"
requires-python = ">=3.14"
license = "AGPL-3.0-only"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2",
    "pydantic-settings>=2",
    "asyncpg>=0.30",
    "jsonschema>=4.23",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "pytest-timeout>=2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# A frame that never comes blocks ``receive_json`` forever; this turns that into a failure
# that names the test.
timeout = 60
markers = [
    "empty_database: the test database starts with no migrations applied",
]
